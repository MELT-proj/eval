# FLEURS-24 ASR dev subset: ~100 utterances per language, subsampled from
# FLEURS `validation` (not `test` -- kept fully held out for final results),
# for the quick in-training generative eval round during MA/IFT campaign
# runs (timeline.md week 1; 05-language-ladder.md §3). This mirrors how
# earlier training configs (e.g. MA-v1.2.yaml) already point their
# `validation_ds` at FLEURS `validation`, not `test`.
#
# Same text_field convention, and the same ga (Irish) caveat, as
# fleurs24-asr-test.yaml -- see that file's header; not repeated per-source
# here.
#
# max_samples uses the freezer's seeded shuffle (seed below), so the same
# 100 utterances are picked on every re-freeze of this spec.
name: fleurs24-asr-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    text_field: custom.pnc_text
    max_samples: 100
    tags: {task: asr, lang: en, dataset_id: fleurs}

  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/es_419/validation
    text_field: custom.pnc_text
    max_samples: 100
    tags: {task: asr, lang: es, dataset_id: fleurs}

