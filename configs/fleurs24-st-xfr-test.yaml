    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/test
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-fr-reference-test.json
    tags: {task: st, src_lang: en, tgt_lang: fr, dataset_id: fleurs-en_fr}

