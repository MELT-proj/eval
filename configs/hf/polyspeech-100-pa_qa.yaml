# PolySpeech-100 (passage audio + question audio), 24 languages: the official EU languages the dataset has, plus uk and ru.
# (Croatian and Irish are not in PolySpeech-100.)
#
# Read **live** from a local reconstruction of the upstream parquet archives
# (docs/polyspeech.md says how it is built and what is in it):
#
#   export POLYSPEECH_ROOT=/e/data1/smurf4eu-data/speech/polyspeech-100    # on jupiter
#   inspect eval melteval/tasks.py@audio_mcq --model melt/<checkpoint> \
#     -T spec=configs/hf/polyspeech-100-pa_qa.yaml -T dataset_id=polyspeech-pa_qa-de
#
# Variant `pa_qa`: the passage and the question are both audio (one waveform:
# passage, a pause, the spoken question); the prompt has a fixed scaffold sentence instead of
# the question text, so the question reaches the model only as audio.
# The four options are always text in the prompt. Scored by accuracy over the options
# (`audio_mcq`, no judge), reported per source, i.e. per language, through `dataset_id`.
#
# One source per language, as for AIR-Bench's splits: `-T dataset_id=` / `-T lang=` then
# stop the other 23 languages being read at all. Always pass one of them for a first run --
# a run without it pools 24 languages (19,224 samples) into one number.
#
# Not every language asks the same questions: 17 share one 801-question set and 7 (de et hu
# lt nl ro ru) another; join across languages on extra.index / extra.qid and compare
# only the overlap. See docs/polyspeech.md.
name: polyspeech-100-pa_qa
seed: 0

input_cfg:
  - type: polyspeech
    root: ${POLYSPEECH_ROOT}
    revision: 5c9235323df63e175819d5bee46b82efc6965bbd
    language: bul_Cyrl
    variant: pa_qa
    tags:
      task: audio_mcq
      lang: bg
