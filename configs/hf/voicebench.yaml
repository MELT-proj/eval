# VoiceBench (https://huggingface.co/datasets/hlt-lab/voicebench), all
# configurations except MT-Bench.
#
# Read live, like configs/hf/air-bench.yaml: the revision below pins the corpus
# and the benchmark's own splits decide which samples exist, so there is no
# local mixture decision for a freeze pass to record.
#
# Every row carries an ``audio`` instruction and its text ``prompt``. The audio
# is what the eval model receives; ``text_prompt`` is only for the judge and
# for programmatic scorers (IFEval, BBH, letter MCQ). No source here sets
# ``instruction_column``: the fixed task instruction comes from the campaign
# model entry.
#
# Task mapping:
#   voicebench_open     alpacaeval, alpacaeval_full, alpacaeval_speaker,
#                       commoneval, wildvoice
#   voicebench_qa       sd-qa
#   voicebench_refusal  advbench
#   voicebench_mcq      openbookqa, mmsu
#   voicebench_ifeval   ifeval
#   voicebench_bbh      bbh
name: voicebench
seed: 0
revision: &revision b02edcef1330480be3a11bd6f7434ac32f05ad08

input_cfg:
  # --- safety / refusal ------------------------------------------------------
  - type: hf_dataset
    repo: hlt-lab/voicebench
    name: advbench
    split: test
    revision: *revision
    text_prompt_column: prompt
    require_reference: false
    tags: {task: voicebench_refusal, lang: en, dataset_id: voicebench-advbench}

  # --- open-ended QA, judged 1-5 --------------------------------------------
  - type: hf_dataset
    repo: hlt-lab/voicebench
    name: alpacaeval
    split: test
    revision: *revision
    text_prompt_column: prompt
    require_reference: false
    tags: {task: voicebench_open, lang: en, dataset_id: voicebench-alpacaeval}

  - type: hf_dataset
    repo: hlt-lab/voicebench
    name: alpacaeval_full
    split: test
    revision: *revision
    text_prompt_column: prompt
    require_reference: false
    tags: {task: voicebench_open, lang: en, dataset_id: voicebench-alpacaeval-full}

