# CoVoST2 ST dev set, ALL directions: the `dev` split of the 21 X->en and 15 en->X pairs of st-eval-campaign-v1.yaml,
# each direction capped at 2000 samples (max_samples, seeded shuffle at freeze time); smaller directions keep all
# of theirs. Reference is the translation (supervisions[0].text); custom.sentence is the source transcript for MetricX.
# One dataset_id per direction (`covost2-<src>_<tgt>-dev`, two-letter codes: sv-SE -> sv, zh-CN -> zh); see
# st-eval-campaign-v1.yaml for why.
#
# Freeze:  melteval freeze configs/shar/st-eval-campaign-v1-dev.yaml -o <frozen>/st-eval-campaign-v1-dev
#          export COVOST2_DEV_SET=<frozen>/st-eval-campaign-v1-dev
name: st-eval-campaign-v1-dev
seed: 0

input_cfg:
  # --- X -> en (21 directions) ------------------------------
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/covost2/ar_en/dev
    max_samples: 2000
    source_text_field: custom.sentence
    tags:
      task: st
      src_lang: ar
      tgt_lang: en
      dataset_id: covost2-ar_en-dev

