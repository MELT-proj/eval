# FLEURS en->X ST test set: the full FLEURS en_us `test` audio, translated into
# each of the 23 other EU-24 languages, scored against that language's FLEURS
# transcription of the same sentence id. The mirror of fleurs24-st-xen-test.yaml:
# FLEURS reads the same FLoRes sentences in every language, so a sentence id
# joins English audio to its text in any target.
#
# Reference resolution: `reference_map` per target,
# configs/refs/fleurs-<lang>-reference-test.json = {sentence_id:
# raw_transcription} from google/fleurs data/<locale>/test.tsv at a pinned
# revision (scripts/build_fleurs_reference.py). Cased and punctuated, one value
# per id (checked: no id has two), like the English map X->en uses.
#
# Coverage: a target language does not have every English test sentence: 251
# of 350 for nl, 330-350 for the rest (2026-10-11). English recordings of a
# sentence the target lacks are dropped at freeze time and counted in
# `dropped_no_reference`; that number is expected here, not a bug. en_us test
# has ~1.85 recordings per sentence, so ~600 samples per direction (~460 for nl).
#
# source_text_field: custom.pnc_text, the English transcript, as COMET's source
# (melteval/rescore.py@comet_scorer).
#
# Per-language breakdown: one dataset_id per direction (`fleurs-en_<lang>`),
# as in the X->en file. Every record's lang is its tgt_lang here, so `-T lang=`
# would also work, but slices go by dataset_id for symmetry with X->en.
name: fleurs24-st-enx-test
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/test
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-bg-reference-test.json
    tags: {task: st, src_lang: en, tgt_lang: bg, dataset_id: fleurs-en_bg}

