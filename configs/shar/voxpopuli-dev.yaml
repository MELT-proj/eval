# VoxPopuli ASR dev set: the `validation` split of the same languages as voxpopuli-test.yaml minus et and lt, same
# source tree, same reference convention (`text`, supervisions[0].text, in every language; en is scored with the
# English normalizer) -- see that file's header for the reasoning. Part of the speechval-dev suite.
# Capped at 1000 samples per language (`max_samples`, seeded shuffle at freeze time; smaller languages keep all
# they have, after the freezer drops untranscribed cuts), because the full split (~18k) takes too long.
#
# Freezing: see docs/speechval.md (azeros has no `.idx` files: index the validation splits first, or use the copy in
# $LOCAL_DATASETS_DIR if present):
#
#   melteval freeze configs/shar/voxpopuli-dev.yaml -o <frozen>/voxpopuli-dev
#   export VOXPOPULI_DEV_SET=<frozen>/voxpopuli-dev
#
# et (47 usable cuts) and lt (3) are left out of the dev set: too small to score.
# One dataset_id per language (`voxpopuli-<lang>-dev`).
name: voxpopuli-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${AZEROS_INDEXED_DIR}/voxpopuli/en/validation
    max_samples: 1000
    text_field: text
    tags: {task: asr, lang: en, dataset_id: voxpopuli-en-dev}

  - type: lhotse_shar
    shar_path: ${AZEROS_INDEXED_DIR}/voxpopuli/de/validation
    max_samples: 1000
    text_field: text
    tags: {task: asr, lang: de, dataset_id: voxpopuli-de-dev}

