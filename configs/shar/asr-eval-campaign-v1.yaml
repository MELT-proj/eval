    text_field: custom.pnc_text
    tags:
      task: asr
      lang: es
      dataset_id: mls_sidon

  # --- cv22_sidon (CommonVoice 22) ----------------------------------------
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/cv22_sidon/en/test
    text_field: custom.metadata.sentence
    tags:
      task: asr
      lang: en
      dataset_id: cv22_sidon

  - type: lhotse_shar
