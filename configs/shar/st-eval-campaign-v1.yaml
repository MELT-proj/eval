# CoVoST2 ST test set, ALL directions: the full `test` split (no max_samples) of the 21 X->en and the 15 en->X
# pairs in the Shar tree (ar ca cy de es et fa fr id it ja lv mn nl pt ru sl sv ta tr zh -> en, and en -> ar ca cy de
# et fa id ja lv mn sl sv ta tr zh). BLEU/spBLEU/chrF++ (and, after rescoring, MetricX).
#
# Reference is the translation (default text field, i.e. supervisions[0].text -- no override needed);
# custom.sentence is the source-language transcript, kept via source_text_field so `melteval rescore` can build
# (src, mt, ref) triples for MetricX-24 afterwards (README's "Rescoring ST output with COMET/MetricX").
#
# Each direction gets its own dataset_id (covost2-<src>_<tgt>, two-letter codes: sv-SE -> sv, zh-CN -> zh), not a
# shared "covost2": BLEU's tokenizer is chosen per target language and corpus_bleu raises rather than pick one for a
# run that mixes languages (melteval/scorers.py, `_target_lang`; zh and ja get their own tokenizers). Run one
# slice per direction:  -T dataset_id=covost2-de_en
#
# The 15 en->X directions share one audio set (CoVoST2 en test, ~15.5k utterances), so freezing them costs 15 x that
# many samples; the dev twin (st-eval-campaign-v1-dev.yaml) caps each direction.
#
# Freeze:  melteval freeze configs/shar/st-eval-campaign-v1.yaml -o <frozen>/covost2-test
#          export COVOST2_SET=<frozen>/covost2-test
name: st-eval-campaign-v1
seed: 0

input_cfg:
  # --- X -> en (21 directions) ------------------------------
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/covost2/ar_en/test
    source_text_field: custom.sentence
    tags:
      task: st
      src_lang: ar
      tgt_lang: en
      dataset_id: covost2-ar_en

  - type: lhotse_shar
