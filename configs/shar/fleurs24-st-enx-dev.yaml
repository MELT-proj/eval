# FLEURS en->X ST dev set, FULL: the whole FLEURS en_us `validation` audio (no max_samples), translated into
# each of the 23 other EU-24 languages, scored against that language's FLEURS transcription of the same sentence id.
# Part of the speechval-dev suite (configs/eval/suites/speechval-dev.yaml).
#
# Twin of fleurs24-st-enx-test.yaml: `validation` audio and configs/refs/fleurs-<lang>-reference-dev.json
# (built with scripts/build_fleurs_reference.py <locales> --splits validation, from google/fleurs
# data/<locale>/dev.tsv at the pinned revision). Reference resolution, the coverage caveat (sentences a target
# lacks are dropped at freeze time and counted in `dropped_no_reference`; expected, e.g. nl has 117 of 150 ids)
# and source_text_field (English `custom.pnc_text`, MetricX's source) are as in that file's header.
# One dataset_id per direction: `fleurs-en_<lang>-dev`.
#
# Freeze:  melteval freeze configs/shar/fleurs24-st-enx-dev.yaml -o <frozen>/fleurs24-st-enx-dev
#          export FLEURS24_ST_ENX_DEV_SET=<frozen>/fleurs24-st-enx-dev
name: fleurs24-st-enx-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-bg-reference-dev.json
    tags: {task: st, src_lang: en, tgt_lang: bg, dataset_id: fleurs-en_bg-dev}

