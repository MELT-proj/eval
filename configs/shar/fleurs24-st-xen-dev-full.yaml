# FLEURS X->en ST dev set, FULL: the whole FLEURS `validation` audio (no max_samples) of the 23 EU locales
# (all but English), scored against the English FLEURS transcription of the same sentence id.
# Part of the speechval-dev suite (configs/eval/suites/speechval-dev.yaml).
#
# Twin of fleurs24-st-xen-test.yaml with `validation` instead of `test`, and the dev English reference
# configs/refs/fleurs-en-reference-dev.json (FLEURS en_us `validation`, 150 ids). Reference resolution and the
# dataset_id-per-direction convention are as in that file's header. ru/uk probes are not included.
#
# source_text_field: supervisions.0.text, the transcript that ships with the corpus (not `custom.pnc_text`, which
# the test spec uses). It is what MetricX gets as source, and it exists for every locale, ga included (the test
# spec's ga source comes out empty because ga has no `custom.pnc_text`).
# JUPITER's azeros tree has no FLEURS for el_gr, pl_pl, ro_ro, sk_sk, sl_si, sv_se; those 6 validation splits were
# copied there from the nyx tree (docs/speechval.md), so all 23 directions are frozen.
# Not to be confused with fleurs24-st-xen-dev.yaml (used by training), which is subsampled to 100 per language.
#
# Freeze:  melteval freeze configs/shar/fleurs24-st-xen-dev-full.yaml -o <frozen>/fleurs24-st-xen-dev-full
#          export FLEURS24_ST_XEN_DEV_SET=<frozen>/fleurs24-st-xen-dev-full
name: fleurs24-st-xen-dev-full
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/es_419/validation
    source_text_field: supervisions.0.text
    reference_map: configs/refs/fleurs-en-reference-dev.json
    tags: {task: st, src_lang: es, tgt_lang: en, dataset_id: fleurs-es_en-dev}

