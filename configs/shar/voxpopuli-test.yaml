# VoxPopuli ASR test set: the `test` split of the 16 VoxPopuli languages with
# transcripts, from the SMURF "azeros" tree on JUPITER
# (/e/data1/smurf4eu-data/speech/azeros/voxpopuli/<lang>/test).
#
# Freezing: azeros has no `.idx` files and the reader needs random access to
# audio, so index a copy first and freeze from it:
#
#   python scripts/index_shar.py $AZEROS_DIR $AZEROS_INDEXED_DIR \
#       voxpopuli/{en,de,fr,es,pl,it,ro,hu,cs,nl,fi,hr,sk,sl,et,lt}/test
#   melteval freeze configs/shar/voxpopuli-test.yaml -o <frozen>/voxpopuli-test
#   export VOXPOPULI_SET=<frozen>/voxpopuli-test
#
# Reference field: `text` (supervisions[0].text) in every language, not
# `custom.pnc_text`, which comes from a PNC model and can hallucinate
# (checked on JUPITER 2026-10-10, one shard per language):
#
# * en, de, fr, es, it: normalised (lowercase, no punctuation, numbers as
#   words: "deux mille huit"). en is scored with the English normalizer;
#   de/fr/es/it count "2008" vs "deux mille huit" as an error (3-4% of cuts).
# * the other 11: already cased and punctuated.
#
# To inspect a language:
#   zcat $AZEROS_DIR/voxpopuli/<lang>/test/cuts.000000.jsonl.gz | head -1
#
# et (51 cuts) and lt (42) give noisy WER. Cut ids repeat across the 11
# re-exported languages, so samples are never keyed by corpus id.
#
# One dataset_id per language (`voxpopuli-<lang>`), so a run can split the set
# into 16 slices and spread them over a node's GPUs (one slice needs more
# than 6 h on a single GPU in jupiter).
name: voxpopuli-test
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${AZEROS_INDEXED_DIR}/voxpopuli/en/test
    text_field: text
    tags: {task: asr, lang: en, dataset_id: voxpopuli-en}

  - type: lhotse_shar
    shar_path: ${AZEROS_INDEXED_DIR}/voxpopuli/de/test
    text_field: text
    tags: {task: asr, lang: de, dataset_id: voxpopuli-de}

  - type: lhotse_shar
    shar_path: ${AZEROS_INDEXED_DIR}/voxpopuli/fr/test
    text_field: text
    tags: {task: asr, lang: fr, dataset_id: voxpopuli-fr}

  - type: lhotse_shar
