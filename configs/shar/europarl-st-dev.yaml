# EuroparlST ST dev subset: all 56 ordered directions among the 8 non-English
# languages fr, de, es, it, pt, pl, ro, nl.
# Directions involving English are left out on purpose: CoVoST covers most of them.
#
# Field convention (same as CoVoST, see st-eval-campaign-v1.yaml): the reference is
# the TARGET-language translation (supervisions[0].text, the default text field, so no
# override), and custom.sentence is the SOURCE-language transcript, kept via
# source_text_field so `melteval rescore` / comet_scorer can build (src, mt, ref)
# triples for COMET-22 DA afterwards.
#
# Language-ID check (2026-11-06): cut ids all start with `en.` (and so do those of
# de_en, whose custom.source_language is `de`), but that prefix is the debate-id
# convention of the corpus, not the audio language. Whisper-base language ID on 12
# validation cuts from each of the 56 directions (CPU): the audio is in the source
# language in 663 of 672 clips (98.7%), and every direction's majority language is its
# source language (at least 10 of 12). The nine others are single clips per direction,
# mis-detected as en/es/pt (short or noisy ones). Metadata and audio agree, so no
# direction is excluded. The 7 directions of one source language largely share their audio
# (same cut ids; the lists differ by a few percent) and differ in the translation.
#
# Known text quirk: the French and Italian text is detokenized badly ("qu ' elle",
# with spaces around the apostrophe) in many cuts -- about 3/4 of fr and 1/2 of it
# translations, and 70% of the French source transcripts in dev. It is reference text as the
# corpus ships it and is not rewritten here; BLEU/chrF++ into fr/it are depressed
# by it for any system that writes normal apostrophes.
#
# Dev: split `validation` (never `test`), capped at max_samples: 100 per direction,
# 5,600 in all. The cap is the freezer's seeded shuffle (the spec's `seed` below, the
# reader's random.Random(seed) over the cuts in shar order), so the same 100 cuts are
# picked on every re-freeze, as in fleurs24-st-xen-dev.yaml. The shuffle runs over
# each direction's own cut list, and those lists differ between targets, so the 100
# cuts of two directions with the same source language overlap only partly (11-22
# for de, fr).
#
# Each direction has its own dataset_id (`europarl-st-<src>_<tgt>-dev`), since BLEU's
# tokenizer is chosen per target language and corpus_bleu refuses to mix targets
# (melteval/scorers.py, `_target_lang`). Slice by dataset_id, one `inspect eval` each.
name: europarl-st-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/europarl_st/fr_de/validation
    source_text_field: custom.sentence
    max_samples: 100
    tags: {task: st, src_lang: fr, tgt_lang: de, dataset_id: europarl-st-fr_de-dev}

  - type: lhotse_shar
