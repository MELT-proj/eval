    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/test
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-nl-reference-test.json
    tags: {task: st, src_lang: en, tgt_lang: nl, dataset_id: fleurs-en_nl}

