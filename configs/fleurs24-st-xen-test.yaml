# FLEURS X->en ST test set: the full FLEURS `test` audio for 23 EU locales
# (all but English), plus ru/uk (added 2026-09-16 -- not EU-24 languages,
# named probes for low-resource Slavic transfer, same reasoning as
# fleurs24-asr-test.yaml's header in melt-eval main; training repo,
# plan/02-backbones.md Sec 3.5), scored against the *English* FLEURS
# transcription of the same sentence id -- not a translation corpus, a
# sentence-parallel read of the same script in different languages (training
# repo, projects/ablation-campaign/plan/05-language-ladder.md Sec 3.1).
# Covers all 24 ladder languages on the ST side except en itself, plus the
# two probes; CoVoST2 X->en (st-eval-campaign-v1.yaml) covers ten of them
# for cross-corpus comparison.
#
# Reference resolution: `reference_map` (new SharReader option, see
# melteval/readers/shar.py) overrides the per-cut target text by cut id,
# bypassing text_field/get_text_from_cut entirely. configs/refs/
# fleurs-en-reference-test.json is `{sentence_id: raw_transcription}` for all
# 350 ids in FLEURS en_us test, fetched once from the HF `google/fleurs`
# metadata (cased, unnormalised -- the corpus's own transcription, not the
# preprocessing repo's truecase/PNC pass, so scores stay comparable to
# published Whisper/SeamlessM4T FLEURS numbers). Chosen over the lowercase
# shar supervision text and over shar's own `custom.pnc_text`, which differs
# across duplicate en_us recordings of the same sentence for 57/350 ids
# (verified 2026-09-15 board entry) -- raw_transcription does not have this
# problem (checked: 0/350 ids have more than one distinct value across their
# recordings). The majority-pnc_text fallback in 05-language-ladder.md Sec
# 3.1 was not needed: the HF fetch succeeded and agreed across recordings.
#
# source_text_field: custom.pnc_text carries the source-language (X)
# transcript for `melteval rescore`'s COMET triples, same convention as
# st-eval-campaign-v1.yaml's CoVoST2 sources. ga (Irish) has no
# `custom.pnc_text` on FLEURS test/validation (fleurs24-asr-test.yaml's
# header) so its source_text comes out empty; harmless for chrF/BLEU
# (scored against the English reference only) but means no COMET source can
# be built for ga until that gap is closed.
#
# Per-language breakdown: unlike ASR, do NOT use `-T lang=<code>` here.
# get_tags_from_cut (training repo, helpers.py) sets the returned `lang` to
# `tgt_lang` for any `task: st` cut ("kept as target for backward compat"),
# so every record in this file reports lang=en regardless of its audio's
# locale -- the `grouped(..., "lang", ...)` BLEU/chrF metric would collapse
# all 23 languages into one "en" bucket. dataset_id is unique per source
# (`fleurs-<src>_en`) for exactly this reason: isolate one language with
# `-T dataset_id=fleurs-de_en`, matching how st-eval-campaign-v1.yaml already
# isolates CoVoST2 directions. (Deviates from the flat `dataset_id: fleurs`
# in the design note in 05-language-ladder.md Sec 3.1's tag example --
# flagged on the campaign board with this reasoning; that section is design
# guidance, not a Settled decision.)
#
# Verification (2026-09-15): all 23 sources built with zero
# dropped_no_reference; sample counts, per-language hours and a manual spot
# check of 20 (audio locale, English reference) pairs are in the board entry
# and frozen_set.json.
name: fleurs24-st-xen-test
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/es_419/test
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-en-reference-test.json
    tags: {task: st, src_lang: es, tgt_lang: en, dataset_id: fleurs-es_en}

