    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-es-reference-dev.json
    max_samples: 100
    tags: {task: st, src_lang: en, tgt_lang: es, dataset_id: fleurs-en_es}

