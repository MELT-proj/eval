    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-it-reference-dev.json
    max_samples: 100
    tags: {task: st, src_lang: en, tgt_lang: it, dataset_id: fleurs-en_it}

