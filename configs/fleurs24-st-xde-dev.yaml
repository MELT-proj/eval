    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-de-reference-dev.json
    max_samples: 100
    tags: {task: st, src_lang: en, tgt_lang: de, dataset_id: fleurs-en_de}

