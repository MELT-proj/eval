# FLEURS X->de ST dev: generated by scripts/build_fleurs_st_configs.py,
# do not edit by hand. Same design as fleurs24-st-xen-test.yaml (see its
# header): the de_de `raw_transcription` of each sentence id is the
# reference (configs/refs/fleurs-de-reference-dev.json), one dataset_id
# per source for per-direction BLEU/chrF, and ga has no source_text.
name: fleurs24-st-xde-dev
seed: 0

input_cfg:
