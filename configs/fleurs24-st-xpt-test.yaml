    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/test
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-pt-reference-test.json
    tags: {task: st, src_lang: en, tgt_lang: pt, dataset_id: fleurs-en_pt}

