# FLEURS en->X ST dev: generated by scripts/build_fleurs_st_configs.py --from-en,
# do not edit by hand. The opposite direction of the fleurs24-st-xen-* specs, whose
# design notes (fleurs24-st-xen-test.yaml's header) apply: every entry reads the same
# FLEURS en_us `validation` audio and scores it against one target locale's
# `raw_transcription` of the same sentence id (the entry's reference_map), one
# dataset_id per target (fleurs-en_<tgt>) for per-direction BLEU/chrF. Cuts without
# a reference for that target are skipped first (before the seeded draw, in dev), so
# the targets do not see the same English recordings: compare models within a
# target, not targets with each other.
name: fleurs24-st-enx-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-es-reference-dev.json
    max_samples: 100
    tags: {task: st, src_lang: en, tgt_lang: es, dataset_id: fleurs-en_es}

  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/en_us/validation
