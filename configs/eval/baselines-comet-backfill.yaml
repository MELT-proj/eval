# Score-only COMET-22 backfill of finished FLEURS ST logs.
# Generation is already done; this config only declares the slices and the
# post-hoc scorer. The logs under logs/ are links/copies of the campaign logs.
name: comet-backfill
output_dir: ${EVAL_ROOT}/comet-backfill
models:
  - name: qwen2-audio-7b-instruct
    model: melt/hf/qwen2_audio
  - name: qwen3-omni-30b-a3b-instruct
    model: melt/hf/qwen3_omni
  - name: whisper-large-v3-translate
    model: melt/hf/whisper
    args_by_task:
        st: [-M, task=translate]
  - name: gemma-4-e4b-it
    model: melt/hf/gemma4
  - name: phi-4-multimodal-instruct
    model: melt/hf/phi4_multimodal
  - name: canary-1b-v2
    model: melt/hf/canary
benchmarks:
  - name: fleurs24-st-enx
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/fleurs24-st-enx-test
    needs_instruction: false
    post_venv: ${METRICS_VENV_PATH}
    slices:
      - {task: st, dataset_id: fleurs-en_bg, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-en_cs, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-en_da, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-en_de, post_scorers: [melteval/rescore.py@comet_scorer]}
