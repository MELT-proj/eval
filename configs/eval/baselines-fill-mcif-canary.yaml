# Fill Canary-1B-v2's MCIF cells.
#
# Canary is not a chat model: its "instruction" is a three-field control string,
# <task>|<source code>|<target code>, that the provider turns into transcribe()
# arguments. MCIF ships free-text prompts, so these slices set `instruction_override`
# to replace them with the spec. Only ASR and ST are meaningful here; SQA needs a
# chat model and stays empty.
#
# Short track only, like the other baselines: the long track is a separate
# (whole-talk) variant and would not be comparable to their numbers.
#
#   python scripts/evaluate.py run   configs/eval/baselines-fill-mcif-canary.yaml --site artemis
#   python scripts/evaluate.py score configs/eval/baselines-fill-mcif-canary.yaml --site artemis --wait
#   python scripts/evaluate.py report configs/eval/baselines-fill-mcif-canary.yaml

name: baselines-fill-mcif-canary
output_dir: ${EVAL_ROOT}/baselines-fill-mcif-canary

models:
  - name: canary-1b-v2
    model: melt/hf/canary
    # NeMo, not transformers: its own venv (docs/baseline-providers.md).
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/canary-shim/activate
    args: [-M, batch_size=16]
    # MCIF's own prompts are free text; canary needs the spec instead.
    instruction_override: true
    instruction:
      chunked_asr: "asr|en|en"
      chunked_st:
        mcif-short-fixed-de: "st|en|de"
        mcif-short-fixed-it: "st|en|it"

benchmarks:
  - name: mcif
    spec: configs/hf/mcif.yaml
    needs_instruction: true
    post_venv: ${METRICS_VENV_PATH}
    slices:
      - {task: chunked_asr, dataset_id: mcif-short-fixed-en}
      - {task: chunked_st, dataset_id: mcif-short-fixed-de, post_scorers: [melteval/mcif_scoring.py@mcif_official_trans_scorer]}  # fmt: skip
      - {task: chunked_st, dataset_id: mcif-short-fixed-it, post_scorers: [melteval/mcif_scoring.py@mcif_official_trans_scorer]}  # fmt: skip
