# Eval suite v1, shared by every config in configs/eval/ (`benchmarks: <this file>`).
# A config that runs only part of it uses `skip`.

benchmarks:
  - name: air-bench
    spec: configs/hf/air-bench.yaml
    # Judge for audio_chat (melteval's rubric, not AIR-Bench's); Qwen3-Omni also grades itself.
    judge: melt/hf/qwen3_omni
    slices:
      - {task: audio_mcq, dataset_id: air-bench-foundation-speech}
      - {task: audio_mcq, dataset_id: air-bench-foundation-sound}
      - {task: audio_mcq, dataset_id: air-bench-foundation-music}
      - {task: audio_chat, dataset_id: air-bench-chat-speech}
      - {task: audio_chat, dataset_id: air-bench-chat-sound}
      - {task: audio_chat, dataset_id: air-bench-chat-music}
      - {task: audio_chat, dataset_id: air-bench-chat-mixed}

  - name: mcif
    spec: configs/hf/mcif.yaml
    # Venv of the post-hoc scorers (mcif-bench: BERTScore, COMET), run by `evaluate.py score`.
    post_venv: ${METRICS_VENV_PATH}
    # Each dataset_id holds several task kinds; one job per kind.
    slices:
      - {task: chunked_asr, dataset_id: mcif-short-fixed-en}
      # COMET-22 DA after mwerSegmenter re-segmentation, MCIF's own pipeline
      # (needs $MWERSEGMENTER_ROOT: an x86 binary, so this needs to run outside jupiter atm).
      - {task: chunked_st, dataset_id: mcif-short-fixed-de, post_scorers: [melteval/mcif_scoring.py@mcif_official_trans_scorer]}
      - {task: chunked_st, dataset_id: mcif-short-fixed-it, post_scorers: [melteval/mcif_scoring.py@mcif_official_trans_scorer]}
      # SQA, short fixed prompt: 220 questions per language on English audio
      # (de/it: question and reference in that language). Scored after
      # generation with MCIF's official BERTScore; no judge model.
      - {task: audio_chat, dataset_id: mcif-short-fixed-en, post_scorers: [melteval/mcif_scoring.py@mcif_official_qa_scorer]}
      - {task: audio_chat, dataset_id: mcif-short-fixed-de, post_scorers: [melteval/mcif_scoring.py@mcif_official_qa_scorer]}
      - {task: audio_chat, dataset_id: mcif-short-fixed-it, post_scorers: [melteval/mcif_scoring.py@mcif_official_qa_scorer]}
      - {task: chunked_st, dataset_id: mcif-short-fixed-zh}
      - {task: chunked_asr, dataset_id: mcif-short-mixed-en}
      - {task: chunked_st, dataset_id: mcif-short-mixed-de}
      - {task: chunked_st, dataset_id: mcif-short-mixed-it}
      - {task: chunked_st, dataset_id: mcif-short-mixed-zh}
      # long: whole talks in one pass
      - {task: chunked_asr, dataset_id: mcif-long-fixed-en, args: [-M, batch_size=1, --max-tokens, "4096"], time: "08:00:00"}
      - {task: chunked_st, dataset_id: mcif-long-fixed-de, args: [-M, batch_size=1, --max-tokens, "4096"], time: "08:00:00"}
      - {task: chunked_st, dataset_id: mcif-long-fixed-it, args: [-M, batch_size=1, --max-tokens, "4096"], time: "08:00:00"}
      - {task: chunked_st, dataset_id: mcif-long-fixed-zh, args: [-M, batch_size=1, --max-tokens, "4096"], time: "08:00:00"}

  - name: librispeech
    spec: configs/hf/librispeech-hf-test-clean.yaml
    needs_instruction: true
    slices:
      # `time`: SLURM wall clock; Qwen3-Omni needs ~1h15 here, past the 1h10 default cap.
      - {task: asr, dataset_id: librispeech-test-clean, time: "02:00:00"}

  - name: librispeech-other
    spec: configs/hf/librispeech-hf-test-other.yaml
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-test-other, time: "02:00:00"}

  # X->en ST from HF (fixie-ai/covost2, see configs/hf/covost2.yaml); what whisper-large-v3-translate runs on.
  - name: covost2
    spec: configs/hf/covost2.yaml
    needs_instruction: true
    slices:
      - {task: st, dataset_id: covost2-de_en}
      - {task: st, dataset_id: covost2-es_en}
      - {task: st, dataset_id: covost2-fr_en}
      - {task: st, dataset_id: covost2-it_en}

  # configs/shar/voxpopuli-test.yaml. en: English normalizer (numbers are spelled out in its reference).
  - name: voxpopuli
    frozen_set: ${VOXPOPULI_SET}
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: voxpopuli-en, args: [-T, normalizer=english]}
      - {task: asr, dataset_id: voxpopuli-de}
      - {task: asr, dataset_id: voxpopuli-fr}
      - {task: asr, dataset_id: voxpopuli-es}
      - {task: asr, dataset_id: voxpopuli-it}
      - {task: asr, dataset_id: voxpopuli-pl}
      - {task: asr, dataset_id: voxpopuli-ro}
      - {task: asr, dataset_id: voxpopuli-hu}
      - {task: asr, dataset_id: voxpopuli-cs}
      - {task: asr, dataset_id: voxpopuli-nl}
      - {task: asr, dataset_id: voxpopuli-fi}
      - {task: asr, dataset_id: voxpopuli-hr}
      - {task: asr, dataset_id: voxpopuli-sk}
      - {task: asr, dataset_id: voxpopuli-sl}
      - {task: asr, dataset_id: voxpopuli-et}
      - {task: asr, dataset_id: voxpopuli-lt}

  - name: fleurs24-asr
    frozen_set: ${FLEURS24_ASR_SET}
    needs_instruction: true
    slices:
      - {task: asr}

  # COMET-22 DA (melteval/rescore.py), scored after generation in the metrics venv.
  - name: fleurs24-st-xen
    frozen_set: ${FLEURS24_ST_XEN_SET}
    needs_instruction: true
    post_venv: ${METRICS_VENV_PATH}
    slices:
      - {task: st, dataset_id: fleurs-bg_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-cs_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-da_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-de_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-el_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-es_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-et_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-fi_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-fr_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-ga_en}  # no FLEURS ga source transcript: BLEU/chrF++ only
      - {task: st, dataset_id: fleurs-hr_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-hu_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-it_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-lt_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-lv_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-mt_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-nl_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-pl_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-pt_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-ro_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-sk_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-sl_en, post_scorers: [melteval/rescore.py@comet_scorer]}
      - {task: st, dataset_id: fleurs-sv_en, post_scorers: [melteval/rescore.py@comet_scorer]}

  # configs/shar/fleurs24-st-enx-test.yaml: English audio into each EU language
  # (one slice per target). COMET-22 DA post-hoc, from the English source.
  - name: fleurs24-st-enx
    frozen_set: ${FLEURS24_ST_ENX_SET}
