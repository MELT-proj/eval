      - {task: st, dataset_id: fleurs-ga_en, post_scorers: [melteval/rescore.py@metricx_scorer]}  # no source transcript: scored with an empty one
      - {task: st, dataset_id: fleurs-hr_en, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-hu_en, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-it_en, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-lt_en, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-lv_en, post_scorers: [melteval/rescore.py@metricx_scorer]}
