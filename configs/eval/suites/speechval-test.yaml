# speechval TEST suite: the test half of the validation/test split -- speechval-dev.yaml's mirror.
# Shared by configs in configs/eval/ (`benchmarks: <this file>`); a config that runs part of it uses `skip`.
#
# Entire test splits only: no slice carries a `limit`, and no source is capped. A debug run passes
# `-T limit=N` against the same frozen set instead of a shrunken source.
#
# VoiceBench, AdvBench and RedVox have no source yet; their stubs are commented at the end.
#
# Wall clock: only LibriSpeech carries `time:`, because that is all dev/v1 had to calibrate against.
# VoxPopuli's own spec warns one language needs >6 h on a single GPU: calibrate `time:` per slice
# before this campaign is scheduled (a wrong guess is mass timeouts or an over-booked queue).

benchmarks:
  # configs/hf/librispeech-hf-test-{clean,other}.yaml (v1's own choice for the test split). The HF cache
  # must be pulled from a login shell first -- compute nodes run HF_HUB_OFFLINE=1; README.md,
  # "Evaluating a HuggingFace benchmark".
  - name: librispeech-test-clean
    spec: configs/hf/librispeech-hf-test-clean.yaml
    needs_instruction: true
    slices:
      # `time`: SLURM wall clock; Qwen3-Omni needs ~1h15 here, past the 1h10 default cap.
      - {task: asr, dataset_id: librispeech-test-clean, time: "02:00:00"}

  - name: librispeech-test-other
    spec: configs/hf/librispeech-hf-test-other.yaml
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-test-other, time: "02:00:00"}

  # configs/shar/voxpopuli-test.yaml. Slice ids are the spec's own dataset_id tags, unsuffixed
  # (`voxpopuli-<lang>`, not `voxpopuli-<lang>-test`). WER/CER use the language-agnostic `basic`
  # normalizer in every slice; only en overrides it with the English one (numbers are spelled out in
  # its reference).
  - name: voxpopuli-test
    frozen_set: ${VOXPOPULI_TEST_SET}
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: voxpopuli-en, args: [-T, normalizer=english]}
      - {task: asr, dataset_id: voxpopuli-de}
      - {task: asr, dataset_id: voxpopuli-fr}
      - {task: asr, dataset_id: voxpopuli-es}
      - {task: asr, dataset_id: voxpopuli-it}
      - {task: asr, dataset_id: voxpopuli-pl}
      - {task: asr, dataset_id: voxpopuli-ro}
      - {task: asr, dataset_id: voxpopuli-hu}
      - {task: asr, dataset_id: voxpopuli-cs}
      - {task: asr, dataset_id: voxpopuli-nl}
      - {task: asr, dataset_id: voxpopuli-fi}
      - {task: asr, dataset_id: voxpopuli-hr}
      - {task: asr, dataset_id: voxpopuli-sk}
      - {task: asr, dataset_id: voxpopuli-sl}
      - {task: asr, dataset_id: voxpopuli-et}
      - {task: asr, dataset_id: voxpopuli-lt}

  # configs/shar/mls-test.yaml: one dataset_id per language, unsuffixed like VoxPopuli's.
  - name: mls-test
    frozen_set: ${MLS_TEST_SET}
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: mls-nl}
      - {task: asr, dataset_id: mls-en}
      - {task: asr, dataset_id: mls-fr}
      - {task: asr, dataset_id: mls-de}
      - {task: asr, dataset_id: mls-it}
      - {task: asr, dataset_id: mls-pl}
      - {task: asr, dataset_id: mls-pt}
      - {task: asr, dataset_id: mls-es}

  # configs/shar/fleurs24-asr-test.yaml tags every language with the one flat `dataset_id: fleurs`, so
  # per-language slices cannot exist: one pooled slice, exactly as v1's `fleurs24-asr` runs it. The
  # scorer's grouped metrics carry the per-language numbers.
  - name: fleurs24-asr-test
    frozen_set: ${FLEURS24_ASR_TEST_SET}
    needs_instruction: true
    slices:
      - {task: asr}

  # configs/hf/mcif.yaml, read live. ASR exists for target `en` only.
  - name: mcif-chunked-asr
    spec: configs/hf/mcif.yaml
    slices:
      - {task: chunked_asr, dataset_id: mcif-short-fixed-en}
      - {task: chunked_asr, dataset_id: mcif-short-mixed-en}

