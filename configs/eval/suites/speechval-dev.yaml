# speechval DEV suite: the dev half of the validation/test split, shared by configs in configs/eval/
# (`benchmarks: <this file>`). A config that runs part of it uses `skip`.

benchmarks:
  # LibriSpeech `validation` (HF, read live; prefetch the split from the login shell, see docs/speechval.md).
  - name: librispeech-validation-clean
    spec: configs/hf/librispeech-hf-validation-clean.yaml
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-validation-clean, time: "02:00:00"}

  - name: librispeech-validation-other
    spec: configs/hf/librispeech-hf-validation-other.yaml
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-validation-other, time: "02:00:00"}

  # configs/shar/voxpopuli-dev.yaml. en: English normalizer (numbers are spelled out in its reference).
  - name: voxpopuli-dev
    frozen_set: ${VOXPOPULI_DEV_SET}
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: voxpopuli-en-dev, args: [-T, normalizer=english]}
      - {task: asr, dataset_id: voxpopuli-de-dev}
      - {task: asr, dataset_id: voxpopuli-fr-dev}
      - {task: asr, dataset_id: voxpopuli-es-dev}
      - {task: asr, dataset_id: voxpopuli-it-dev}
      - {task: asr, dataset_id: voxpopuli-pl-dev}
      - {task: asr, dataset_id: voxpopuli-ro-dev}
      - {task: asr, dataset_id: voxpopuli-hu-dev}
      - {task: asr, dataset_id: voxpopuli-cs-dev}
      - {task: asr, dataset_id: voxpopuli-nl-dev}
      - {task: asr, dataset_id: voxpopuli-fi-dev}
      - {task: asr, dataset_id: voxpopuli-hr-dev}
      - {task: asr, dataset_id: voxpopuli-sk-dev}
      - {task: asr, dataset_id: voxpopuli-sl-dev}
      - {task: asr, dataset_id: voxpopuli-et-dev}
      - {task: asr, dataset_id: voxpopuli-lt-dev}

  # configs/shar/fleurs24-st-xen-dev-full.yaml: full FLEURS validation, X->en, English reference from configs/refs/fleurs-en-reference-dev.json.
  # MetricX-24 hybrid XXL post-hoc, from the source transcript.
  - name: fleurs24-st-xen-dev
    frozen_set: ${FLEURS24_ST_XEN_DEV_SET}
    needs_instruction: true
    post_venv: ${METRICS_VENV_PATH}
    slices:
      - {task: st, dataset_id: fleurs-bg_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-cs_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-da_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-de_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-el_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-es_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-et_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-fi_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-fr_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-ga_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}  # no source transcript: scored with an empty one
      - {task: st, dataset_id: fleurs-hr_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-hu_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-it_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
