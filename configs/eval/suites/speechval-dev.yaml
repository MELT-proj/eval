      - {task: st, dataset_id: fleurs-mt_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-nl_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-pl_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-pt_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-ro_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: fleurs-sk_en-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
