# speechval DEV suite: the dev half of the validation/test split, shared by configs in configs/eval/
# (`benchmarks: <this file>`). A config that runs part of it uses `skip`.

benchmarks:
  # configs/shar/europarl-st-dev.yaml: EuroparlST, the 72 directions among en/fr/de/es/it/pt/pl/ro/nl (validation, 500 per direction).
  # MetricX-24 hybrid XXL (reference-based) post-hoc, from custom.sentence (the source transcript).
  - name: europarl-st-dev
    frozen_set: ${EUROPARL_ST_DEV_SET}
    needs_instruction: true
    post_venv: ${METRICS_VENV_PATH}
    slices:
      - {task: st, dataset_id: europarl-st-fr_de-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
      - {task: st, dataset_id: europarl-st-fr_es-dev, post_scorers: [melteval/rescore.py@metricx_scorer]}
