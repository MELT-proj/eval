# Fill the ASR cells that are still empty for the baselines that can transcribe
# but were never run on FLEURS-24, LibriSpeech or MCIF chunked ASR.
#
#   python scripts/evaluate.py run configs/eval/baselines-fill-asr.yaml --site artemis --wait

name: baselines-fill-asr
output_dir: ${EVAL_ROOT}/baselines-fill-asr

models:
  - name: qwen2-audio-7b-instruct
    model: melt/hf/qwen2_audio
    args: [-M, batch_size=8]
    # MCIF ASR and LibriSpeech already have a number from the Jupiter campaign.
    skip: [mcif, librispeech, librispeech-other]
    instruction:
      asr: "Transcribe this {lang} audio. Output only the transcription."

  - name: qwen3-omni-30b-a3b-instruct
    model: melt/hf/qwen3_omni
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/qwen3-shim/activate
    args: [-M, batch_size=4]
    skip: [mcif, librispeech, librispeech-other]
    instruction:
      asr: "Transcribe this {lang} audio."

  - name: whisper-large-v3
    model: melt/hf/whisper
    args: [-M, batch_size=8]
    skip: [librispeech, librispeech-other]

  - name: apertus-1.5-8b
    model: melt/hf/apertus
    venv: ${APERTUS_VENV_PATH}
    args: [-M, batch_size=8]
    instruction:
      asr: "Transcribe this {lang} audio. Output only the transcription."

  # MCIF ASR only: these two already have FLEURS ASR from the October campaign.
  - name: gemma-4-e4b-it
    model: melt/hf/gemma4
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/gemma-shim/activate
    args: [-M, batch_size=8]
    skip: [fleurs24-asr-test, librispeech]

  - name: phi-4-multimodal-instruct
    model: melt/hf/phi4_multimodal
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/pre-tf5-shim/activate
    args: [-M, batch_size=8]
    skip: [fleurs24-asr-test, librispeech]

benchmarks:
  - name: fleurs24-asr-test
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/fleurs24-asr-test
    needs_instruction: true
    slices:
      - {task: asr}

  # The frozen set, not the Hub spec: the October baselines used this one and
  # it is already staged on the cluster.
  - name: librispeech
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/librispeech
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-clean, time: "02:00:00"}
      - {task: asr, dataset_id: librispeech-other, time: "02:00:00"}

  - name: mcif
    spec: configs/hf/mcif.yaml
    slices:
      - {task: chunked_asr, dataset_id: mcif-short-fixed-en}
