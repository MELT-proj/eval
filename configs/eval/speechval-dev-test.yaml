# speechval-dev smoke test: newest readable SMURF checkpoint, 5 samples per slice (--limit 5).
name: speechval-dev-test
output_dir: ${EVAL_ROOT}/speechval-dev-test
pack:
  time: "01:00:00"
  max_slices: 20
models:
  - name: smurf-step-50000
    model: smurf//e/project1/e-ext-2025e01-100/models/step=50000.ckpt
    # map_location=cpu: load in host RAM and move to the GPU already in bf16
    args: [-M, batch_size=8, -M, map_location=cpu]
    # Loads the checkpoint with prompt_format=eurollm (stored: qwen)
    # Checkpoints evaluated before this (qwen, no override) used
    # `-M system_placement=user` instead, which opens the user turn with the system prompt.
    model_config_override: configs/smurf/eurollm_override_config.yaml
    instruction:
      asr: "Transcribe this {lang} audio: "
      # The ST instruction must state the output constraint explicitly. An
      # ASR-biased SMURF checkpoint (EuroLLM-Speech) otherwise transcribes the
      # source instead of translating it; the generic system prompt below does
      # not compensate for that on its own. Evidence: with this system prompt,
      # on the same 10 bg->en samples, the old "Translate this {src_lang}
      # audio into {tgt_lang}:" instruction produced 8/10 Bulgarian
      # transcripts, while this explicit form produced 10/10 English
      # translations.
      st: "Translate the following {src_lang} speech into {tgt_lang}. Output only the {tgt_lang} translation, never the {src_lang} transcript:"
    # One system prompt for every task (ASR, ST, and the QA tasks: audio_chat,
    # audio_mcq). It names the three output modes and leaves the choice to the
    # instruction, so the same text works across benchmarks and checkpoints.
    system:
      default: >-
        Follow the user's instruction exactly. If it asks you to transcribe,
        output only the verbatim transcript in the language spoken. If it asks
        you to translate, output only the translation, written entirely in the
        language named as the target, never a transcript in the source language.
        If it asks a question, answer only the question, in the language it is
        asked. Output only the requested result and do not repeat these
        instructions.

benchmarks: configs/eval/suites/speechval-dev.yaml
