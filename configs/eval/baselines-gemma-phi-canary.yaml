# Off-the-shelf baselines on the frozen FLEURS-24 test sets, LibriSpeech and VoxPopuli:
# Gemma 4 E4B-it and Phi-4-multimodal-instruct (canary-1b-v2 is added by its own provider).
#
#   python scripts/evaluate.py plan  configs/eval/baselines-gemma-phi-canary.yaml --site artemis
#   python scripts/evaluate.py run   configs/eval/baselines-gemma-phi-canary.yaml --site artemis --limit 5   # smoke
#
# Each model gets the prompts its card documents (docs/baseline-providers.md); clips
# longer than a model's stated limit are passed whole and counted in the log metadata.

name: baselines-gemma-phi-canary
output_dir: ${EVAL_ROOT}/baselines-gemma-phi-canary

models:
  - name: gemma-4-e4b-it
    model: melt/hf/gemma4
    args: [-M, batch_size=8]
    instruction:
      asr: "Transcribe the following speech segment in {lang} into {lang} text.\n\nFollow these specific instructions for formatting the answer:\n* Only output the transcription, with no newlines.\n* When transcribing numbers, write the digits, i.e. write 1.7 and not one point seven, and write 3 instead of three."
      st: "Transcribe the following speech segment in {src_lang}, then translate it into {tgt_lang}.\nWhen formatting the answer, first output the transcription in {src_lang}, then one newline, then output the string '{tgt_lang}: ', then the translation in {tgt_lang}."
  - name: phi-4-multimodal-instruct
    model: melt/hf/phi4_multimodal
    # The Hub repo's own code predates transformers 5 (it refuses sdpa and flash attention there).
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/pre-tf5-shim/activate
    args: [-M, batch_size=8]
    instruction:
      asr: "Transcribe the audio clip into text."
      # Literal per pair: this environment has no language table for {tgt_lang}. The card lists
      # German, Spanish, French, Italian, Portuguese (and Japanese, Chinese, not in FLEURS-24)
      # as the languages translated to and from English.
      st:
        fleurs-de_en: "Translate the audio to English."
        fleurs-es_en: "Translate the audio to English."
        fleurs-fr_en: "Translate the audio to English."
        fleurs-it_en: "Translate the audio to English."
        fleurs-pt_en: "Translate the audio to English."
        fleurs-en_de: "Translate the audio to German."
        fleurs-en_es: "Translate the audio to Spanish."
        fleurs-en_fr: "Translate the audio to French."
        fleurs-en_it: "Translate the audio to Italian."
        fleurs-en_pt: "Translate the audio to Portuguese."
  - name: canary-1b-v2
    model: melt/hf/canary
    # NeMo, not transformers: its own venv (docs/baseline-providers.md). The "instruction" is
    # a spec, <task>|<source code>|<target code>, that the provider turns into transcribe() arguments.
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/canary-shim/activate
    args: [-M, batch_size=16]
    instruction:
      asr: "asr|{lang_code}|{lang_code}"
      st: "st|{src_lang_code}|{tgt_lang_code}"

benchmarks:
  - name: librispeech
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/librispeech
    needs_instruction: true
    slices:
      - {task: asr, dataset_id: librispeech-clean}
      - {task: asr, dataset_id: librispeech-other}
  - name: fleurs24-asr-test
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/fleurs24-asr-test
    needs_instruction: true
    slices:
      - {task: asr}
  - name: fleurs24-st-xen-test
    frozen_set: /mnt/scratch-artemis/giuseppe/melt-data/eval-sets/fleurs24-st-xen-test
    needs_instruction: true
    slices:
      - {task: st, dataset_id: fleurs-de_en}
