# SMURF checkpoint eurollm_speech_16_nodes_run_1_asr_long, latest (step 600000),
# pulled from jupiter on 2026-11-12.
#
# Stored prompt_format is `qwen` (exp_config.yaml), but this run is evaluated
# with the EuroLLM chat format via configs/smurf/eurollm_override_config.yaml:
# the system prompt then has its own turn. See docs/smurf-provider.md.
#
# CoVoST2 runs only in the directions both sides of which the model covers
# (en<->EU: 11 X->en, 5 en->X); the rest are skipped explicitly, as in the
# canary config. smurf-v1 skipped the whole benchmark instead, which was a
# campaign choice, not a model limitation.
#
#   python scripts/evaluate.py plan configs/eval/speechval-smurf.yaml --site artemis
#   python scripts/evaluate.py run  configs/eval/speechval-smurf.yaml --site artemis --wait

name: speechval-smurf
output_dir: ${EVAL_ROOT}/speechval-smurf

models:
  - name: eurollm-speech-16n-step-600000
    model: smurf//mnt/scratch-nyx/giuseppe/checkpoints/smurf/eurollm_speech_16_nodes_run_1_asr_long/step=600000.ckpt
    venv: /mnt/scratch-artemis/giuseppe/venvs/smurf-eval/bin/activate
    # Loads the checkpoint with prompt_format=eurollm (the stored value is the
    # training default, qwen). The EuroLLM format has a system role, so the
    # system prompt goes in its own turn — the default placement.
    model_config_override: configs/smurf/eurollm_override_config.yaml
    # map_location=cpu: load in host RAM and move to the GPU already in bf16
    args: [-M, batch_size=8, -M, map_location=cpu]
    instruction:
      asr: "Transcribe this {lang} audio: "
      st: "Translate this {src_lang} audio into {tgt_lang}: "
    system:
      default: &qa >-
        Answer the question about the audio in the language the question is asked in.
        Output only the answer. Do not repeat these instructions.
      asr: &transcribe >-
        Transcribe the speech in the audio verbatim, in the language it is spoken in.
        Output only the transcript. Do not repeat these instructions.
      chunked_asr: *transcribe
      st: &translate >-
        Translate the speech in the audio into the target language named in the instruction.
        Output only the translation, written entirely in the target language, even if the speech
        is in another language. Do not repeat these instructions.
      chunked_st: *translate

benchmarks: configs/eval/suites/speechval-dev.yaml

