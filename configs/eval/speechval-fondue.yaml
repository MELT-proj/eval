# Fondue (MELT + EuroLLM-1.7B) checkpoints on speechval-dev (3000, 17000, 20000,
# 26000; the latest verified checkpoint of the live run).
#
# The checkpoints are HF-format MELT directories; they were saved without the
# processor and without a training_config.yaml beside them, so both come from
# the run output:
#   processor:         /mnt/scratch-nyx/giuseppe/melt/outputs-fondue/Fondue/processor
#   training_config:   /mnt/scratch-nyx/giuseppe/melt/outputs-fondue/Fondue/training_config.yaml
# melt_prompt reads the format from there (chatml, chat template applied), which
# is what the run trained with; never infer it.
#
#   python scripts/evaluate.py plan configs/eval/speechval-fondue.yaml --site artemis
#   python scripts/evaluate.py run  configs/eval/speechval-fondue.yaml --site artemis --wait

name: speechval-fondue
output_dir: ${EVAL_ROOT}/speechval-fondue

models:
  - name: fondue-step-3000
    model: melt//mnt/scratch-nyx/giuseppe/fondue-keep/checkpoint-3000
    # MoE audio adapter: needs the `main` training checkout, layered over the
    # melteval venv by this shim (the installed melt is older and rejects `moe`).
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/melt-main/activate
    args: &fondue_args
      - -M
      - batch_size=8
      - -M
      - processor=/mnt/scratch-nyx/giuseppe/melt/outputs-fondue/Fondue/processor
      - -T
      - format_config=/mnt/scratch-nyx/giuseppe/melt/outputs-fondue/Fondue/eval_format.yaml
      - -T
      - tokenizer=/mnt/scratch-nyx/giuseppe/melt/outputs-fondue/Fondue/processor
  - name: fondue-step-17000
    model: melt//mnt/scratch-nyx/giuseppe/fondue-keep/checkpoint-17000
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/melt-main/activate
    args: *fondue_args
  - name: fondue-step-20000
    model: melt//mnt/scratch-nyx/giuseppe/fondue-keep/checkpoint-20000
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/melt-main/activate
    args: *fondue_args
  # Newest verified checkpoint on the nyx copy as of 2026-11-13 15:00 (27000 had
  # not been written yet). Same architecture and format as the ones above.
  - name: fondue-step-26000
    model: melt//mnt/scratch-nyx/giuseppe/fondue-keep/checkpoint-26000
    venv: /mnt/scratch-artemis/giuseppe/melt-data/pyextras/melt-main/activate
    args: *fondue_args

benchmarks: configs/eval/suites/speechval-dev.yaml

