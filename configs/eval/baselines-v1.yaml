# Every model against every benchmark: the baseline comparison.
#
#   python scripts/evaluate.py plan   configs/eval/baselines-v1.yaml --site bocconi
#   python scripts/evaluate.py run    configs/eval/baselines-v1.yaml --site bocconi --wait
#   python scripts/evaluate.py score  configs/eval/baselines-v1.yaml --site bocconi --wait
#
# Format and output folder: docs/running-evaluations.md. Nothing here is
# specific to one machine: paths that differ between machines are ${VARIABLES},
# set by the site file (infra/sites/<site>.sh) or exported in the shell.

name: baselines-v1

# Everything goes here: config.yaml, submissions.jsonl, logs/, results/.
output_dir: ${EVAL_ROOT}/baselines-v1

# Only read on a site that packs slices (MELT_PACK_GPUS, e.g. JUPITER): one
# whole-node job per model (and per set of model arguments), one worker per GPU.
# Elsewhere every slice is still its own job. See configs/eval/smurf-v1.yaml.
pack:
  time: "06:00:00"
  max_slices: 20

models:
  - name: qwen2-audio-7b-instruct
    model: melt/hf/qwen2_audio
    # 30 s window: the few longer clips are skipped as error samples, not fatal.
    args: [-M, batch_size=8]
    # Skipped: most clips run past the 30 s window (MCIF long, AIR-Bench music).
    skip: [mcif-long-*, air-bench-foundation-music]
    # For benchmarks marked `needs_instruction` (their samples carry none of # their own). No entry for a slice's task: that slice is skipped.
    instruction:
      # Asks for the bare transcription: with "Transcribe this audio." it
      # prefixes many answers with "The original content of this audio is:", # which is scored as-is.
      asr: "Transcribe this audio. Output only the transcription."
      st: "Translate this audio into {tgt_lang}."

  - name: qwen3-omni-30b-a3b-instruct
    model: melt/hf/qwen3_omni
    args: [-M, batch_size=4]
    instruction:
      asr: "Transcribe this audio."
      st: "Translate this audio into {tgt_lang}."

  # Whisper takes no instruction: it transcribes, or (task=translate) translates into English, and the language is auto-detected. The `instruction` below is ignored by the provider
  - name: whisper-large-v3
    model: melt/hf/whisper
    args: [-M, batch_size=8]
    skip: [air-bench-*, mcif-*]
    instruction:
      asr: "Transcribe this audio."

  - name: whisper-large-v3-translate
    model: melt/hf/whisper
    args: [-M, batch_size=8, -M, task=translate]
    # Whisper only translates into English: no en->X.
    skip: [air-bench-*, mcif-*, fleurs-en_*]
    instruction:
      st: "Translate this audio into {tgt_lang}."

  - name: desta2.5-audio
    model: melt/hf/desta25
    venv: ${DESTA_VENV_PATH}
    args: [-M, batch_size=8]
    # Same 30 s window as Qwen2-Audio, so the same slices are skipped (see there).
    skip: [mcif-long-*, air-bench-foundation-music]
    instruction:
      asr: "Transcribe this audio. Output only the transcription."
      st: "Translate this audio into {tgt_lang}."
    # System prompts per task as the DeSTA2.5 authors recommend (see docs/baseline-providers.md).
    # MCQ user turn follows their evaluation_tips.md.
    mcq_instruction: "{question}\nThe answer could be: {options}"
    system:
      default: "Focus on the audio clips and instruction."
      asr: "Focus on the audio clips and instruction. Respond directly without any other words"
      chunked_asr: "Focus on the audio clips and instruction. Respond directly without any other words"
      audio_mcq: "Focus on the audio clips and instruction. Choose one of the options without any explanation."

  - name: smurf
    # Always one .ckpt file in checkpoints/smurf/ (gitignored).
    model: smurf/checkpoints/smurf/*.ckpt
    # Same as configs/eval/smurf-v1.yaml (see the comments there): load on the host,
    # zero-shot instructions with the sample's languages.
    args: [-M, batch_size=8, -M, map_location=cpu]
    instruction:
      asr: "Transcribe this {lang} audio: "
      st: "Translate this {src_lang} audio into {tgt_lang}: "

  - name: melt
    # Always one run folder in checkpoints/melt/. The prompt format is read
    # from its training_config.yaml; without one the run fails rather than guess.
    model: melt/checkpoints/melt/*/
    # MELT needs melt-proj, which the SMURF venv does not have.
    venv: ${MELT_VENV_PATH}
    args: [-M, batch_size=4]

benchmarks: configs/eval/suites/v1.yaml
