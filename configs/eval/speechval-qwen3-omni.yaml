# Qwen3-Omni-30B-A3B-Instruct on the dev partition: the two dev suites together
# (`speechval-dev.yaml` + `speechval-polyspeech.yaml`), one row of the baseline
# matrix next to MELT, SMURF and the other off-the-shelf baselines.
#
# Jupiter only: the PolySpeech reconstruction lives there, and the dev frozen
# sets are frozen from Jupiter's corpora (docs/speechval.md, "Frozen sets on
# Jupiter"). The weights are the Hub revision the provider pins
# (docs/baseline-providers.md), already in the shared HF cache.
#
#   python scripts/evaluate.py plan configs/eval/speechval-qwen3-omni.yaml --site jupiter
#   python scripts/evaluate.py run  configs/eval/speechval-qwen3-omni.yaml --site jupiter
#   python scripts/evaluate.py score configs/eval/speechval-qwen3-omni.yaml --site jupiter
#
# Language coverage: Qwen3-Omni takes speech in 19 languages (English, Chinese,
# Korean, Japanese, German, Russian, Italian, French, Spanish, Portuguese,
# Malay, Dutch, Indonesian, Turkish, Vietnamese, Cantonese, Arabic, Urdu). The
# dev partition's other source languages are skipped explicitly below rather
# than scored as noise: a row's macro is over the slices the model supports,
# as for Canary and Whisper (docs/speechval.md). Target languages are text, and
# the model writes 119 of them, so every en->X direction runs.
#
# Audio in, text out: the talker is dropped (Qwen3-Omni is a text model here),
# and the provider turns the processor's 30 s truncation off, so PolySpeech's
# passages go in whole -- batch_size is sized for those, not for FLEURS.

name: speechval-qwen3-omni
output_dir: ${EVAL_ROOT}/speechval-qwen3-omni

# One whole node (4 GH200) per pack, as for the PolySpeech battery: the 30B-A3B
# weights are ~66 GB, so one slice per GPU at a time and one load per worker.
# The cap is set from the measured pass (see docs/speechval.md).
pack:
  time: "06:00:00"
  max_slices: 24

models:
  - name: qwen3-omni-30b-a3b-instruct
    model: melt/hf/qwen3_omni
    args: [-M, batch_size=4]
    # Long PolySpeech passages: fewer, longer items per forward pass.
    args_by_task:
      audio_mcq: [-M, batch_size=2]
    instruction:
      asr: "Transcribe this {lang} audio."
      st: "Translate this {src_lang} audio into {tgt_lang}."

    skip:
      # --- ASR: VoxPopuli languages outside the 19 speech-input languages ---
      - voxpopuli-pl-dev
      - voxpopuli-ro-dev
      - voxpopuli-hu-dev
      - voxpopuli-cs-dev
      - voxpopuli-fi-dev
      - voxpopuli-hr-dev
      - voxpopuli-sk-dev
      - voxpopuli-sl-dev

      # --- ST, X->en: the source audio is in an unsupported language ---
      # FLEURS (23 European source languages: de es fr it nl pt are the supported six)
      - fleurs-bg_en-dev
      - fleurs-cs_en-dev
      - fleurs-da_en-dev
      - fleurs-el_en-dev
      - fleurs-et_en-dev
      - fleurs-fi_en-dev
      - fleurs-ga_en-dev
      - fleurs-hr_en-dev
      - fleurs-hu_en-dev
      - fleurs-lt_en-dev
      - fleurs-lv_en-dev
      - fleurs-mt_en-dev
      - fleurs-pl_en-dev
      - fleurs-ro_en-dev
      - fleurs-sk_en-dev
      - fleurs-sl_en-dev
      - fleurs-sv_en-dev
      # CoVoST2 (supported: ar de es fr it ja nl pt ru tr)
      - covost2-ca_en-dev
      - covost2-cy_en-dev
      - covost2-et_en-dev
      - covost2-fa_en-dev
      - covost2-id_en-dev
      - covost2-lv_en-dev
      - covost2-mn_en-dev
      - covost2-sl_en-dev
      - covost2-sv_en-dev
      - covost2-ta_en-dev
      - covost2-zh_en-dev
      # Europarl: every pair with Polish or Romanian on the source side.
      - europarl-st-pl_*
      - europarl-st-ro_*

benchmarks:
  - configs/eval/suites/speechval-dev.yaml
  - configs/eval/suites/speechval-polyspeech.yaml
