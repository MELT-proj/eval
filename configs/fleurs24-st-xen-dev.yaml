# FLEURS X->en ST dev subset: ~100 utterances per language from FLEURS
# `validation` (never `test`, held out for final results), for the
# in-training generative eval round alongside fleurs24-asr-dev.yaml
# (05-language-ladder.md Sec 3.1; timeline.md week 1). Sample selection uses
# the freezer's seeded shuffle (seed below) against the *same* per-language
# `validation` shar sources fleurs24-asr-dev.yaml draws from, so both tasks
# tend to land on overlapping sentence ids for the same locale even though
# each freeze picks its own subset independently (no cross-task id pinning
# implemented here).
#
# Same reference_map, source_text_field, dataset_id-for-breakdown and ga
# caveats as fleurs24-st-xen-test.yaml -- see that file's header, not
# repeated per-source here. Reference map is configs/refs/
# fleurs-en-reference-dev.json (150 ids, FLEURS en_us `validation`).
name: fleurs24-st-xen-dev
seed: 0

input_cfg:
  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/es_419/validation
    source_text_field: custom.pnc_text
    reference_map: configs/refs/fleurs-en-reference-dev.json
    max_samples: 100
    tags: {task: st, src_lang: es, tgt_lang: en, dataset_id: fleurs-es_en}

  - type: lhotse_shar
    shar_path: ${LOCAL_DATASETS_DIR}/fleurs/fr_fr/validation
