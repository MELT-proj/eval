[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melt-eval"
version = "0.1.0"
description = "Downstream evaluation harness for MELT speech models, built on inspect_ai"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Giuseppe Attanasio", email = "gattanasio.work@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    # Pinned: scorer output and log schema move between releases, and eval
    # numbers should not move with them. Upstream tags are `release/YYYY-MM-DD`,
    # not `v0.3.x`, if a git ref is ever needed.
    "inspect_ai==0.3.254",
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Reading lhotse Shar sources, and the MELT provider itself. Heavy (torch,
# transformers) because loading a checkpoint needs the training package.
shar = [
    "lhotse==2.0.0a3",
    "melt-proj",
    "soundfile>=0.13",
]
# Remote HuggingFace test splits, whose audio arrives at arbitrary sample rates.
hf = [
    "datasets>=4.0",
    "librosa>=0.11",
]
# Lexical metrics. sacrebleu is pinned: BLEU is not comparable across versions
# or tokenizer configurations, so the number and its signature must be stable.
metrics = [
    "jiwer>=4.0",
    "sacrebleu==2.5.1",
]
dev = [
    "pytest",
    "ruff",
]
# Reading finished eval logs into tables and charts (`projects/melt`). Reading
# a log needs nothing from the model side, so this stays clear of torch and the
# training package and installs fine on a login node.
analysis = [
    "marimo>=0.24",
    "pandas>=2.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Deterministic, faster batched decode (MELT-proj/eval#7, MELT-proj/training#118).
# Pinned to the same prebuilt wheel as the training repo, matching the `shar`
# extra's torch/cuda/python build -- a source build needs nvcc, which a login
# node does not have.
flash-attn = [
    "flash-attn",
]

[project.scripts]
melteval = "melteval.cli:main"

# Registers melteval's providers, solvers, scorers and tasks with inspect_ai's
# registry on demand, so `inspect eval ... --model melt/<ckpt>` resolves without
# an explicit import. See inspect_ai/_util/entrypoints.py.
[project.entry-points.inspect_ai]
melteval = "melteval"

# The training package is not on PyPI. Point uv at the sibling checkout so
# `uv pip install -e ".[shar]"` resolves it from source.
[tool.uv.sources]
melt-proj = { path = "../training", editable = true }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }

[tool.setuptools.packages.find]
where = ["."]
include = ["melteval*"]

[tool.ruff]
target-version = "py310"
line-length = 119
include = ["melteval/**/*.py", "tests/**/*.py", "projects/**/*.py"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "RUF013", "PERF102", "SIM", "UP", "FURB"]
ignore = ["C901", "E501", "E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# marimo owns the layout of its notebooks and rewrites the preamble whenever
# one is saved from the editor, with a single blank line after `import marimo`
# rather than the two this repo's isort setting wants. Not worth a fight ruff
# would lose on every save.
"projects/melt/report.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
